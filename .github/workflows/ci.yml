name: Node.js CI

on:
    push:
        branches: [development, main]
    pull_request:
        branches: [development, main]

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v2
            - name: Use Node.js
              uses: actions/setup-node@v2
              with:
                  node-version: "20.x"
            - run: npm install
            - run: npm test